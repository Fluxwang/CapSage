<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>EchoSage</title>
  <style>
    :root { --accent: #168ea3; color: #1d1b18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { width: 400px; margin: 0; background: #fff; }
    button, select { font: inherit; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px 10px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
    .mark { display: grid; width: 23px; height: 23px; place-items: center; border-radius: 7px; color: #fff; background: var(--accent); font-size: 12px; }
    .settings { width: 30px; height: 30px; border: 0; border-radius: 8px; color: #6f6a63; background: #f4f2ef; cursor: pointer; font-size: 16px; }
    .settings:hover { background: #eceae6; }
    .tabs { display: flex; gap: 18px; padding: 0 14px; border-bottom: 1px solid #eceae6; }
    .tab { padding: 9px 2px 10px; border: 0; border-bottom: 2px solid transparent; color: #8a857e; background: transparent; cursor: pointer; font-size: 13px; }
    .tab[aria-selected="true"] { border-bottom-color: var(--accent); color: #1d1b18; font-weight: 650; }
    main { padding: 14px; }
    .panel[hidden] { display: none; }
    .panel { display: grid; gap: 12px; }
    .session-card, .video-card { display: grid; gap: 11px; padding: 12px; border: 1px solid #e3e0da; border-radius: 12px; background: #faf9f7; }
    .session-meta, .video-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .language { color: #6f6a63; font-size: 12px; }
    .language strong { color: #3b372f; font-weight: 600; }
    .language select { margin: 0 2px; border: 0; color: #3b372f; background: transparent; font-size: 12px; font-weight: 600; }
    .vu { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
    .vu-bar { width: 3px; height: 17px; border-radius: 2px; background: var(--accent); opacity: .22; transform: scaleY(.16); transform-origin: bottom; transition: transform .1s ease, opacity .1s ease; }
    .session-time, .video-meta { color: #8a857e; font-size: 11px; }
    .status { min-height: 37px; color: #6f6a63; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
    .actions { display: flex; gap: 8px; }
    .button { min-height: 36px; border: 0; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .primary { flex: 1; color: #fff; background: var(--accent); }
    .primary:hover { background: #117d90; }
    .secondary { min-width: 78px; color: #3b372f; background: #f0eeea; }
    .secondary:hover { background: #e7e4df; }
    .button:disabled { cursor: default; opacity: .48; }
    .transcript-head { display: flex; align-items: baseline; justify-content: space-between; }
    .transcript-head h2 { margin: 0; color: #3b372f; font-size: 12px; font-weight: 650; }
    .hint { color: #a29d95; font-size: 11px; }
    .transcript, .video-captions { min-height: 116px; max-height: 220px; overflow-y: auto; padding: 10px; border: 1px solid #eceae6; border-radius: 11px; background: #fff; color: #3b372f; font-size: 12px; line-height: 1.55; }
    .empty { color: #a29d95; line-height: 1.65; }
    .turn-source { margin-top: 7px; }
    .turn-source:first-child { margin-top: 0; }
    .turn-translation { margin-top: 2px; color: var(--accent); font-weight: 600; }
    .turn-partial { margin-top: 8px; color: #a29d95; font-style: italic; }
    .video-card { grid-template-columns: 58px minmax(0, 1fr); align-items: center; }
    .cover { width: 58px; height: 72px; border-radius: 8px; object-fit: cover; background: #eceae6; }
    .video-description { display: -webkit-box; overflow: hidden; margin-top: 3px; color: #6f6a63; font-size: 12px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .video-caption-row { display: grid; grid-template-columns: 45px minmax(0, 1fr); gap: 7px; margin-bottom: 9px; }
    .video-caption-row:last-child { margin-bottom: 0; }
    .video-time { color: #a29d95; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .video-translation { margin-top: 2px; color: var(--accent); font-weight: 600; }
    .video-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .video-actions .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand"><span class="mark">E</span><span>EchoSage</span></div>
    <button id="open-options" class="settings" type="button" aria-label="打开设置">⚙</button>
  </header>
  <nav class="tabs" aria-label="场景">
    <button class="tab" type="button" data-tab="live" aria-selected="true">直播实时</button>
    <button class="tab" type="button" data-tab="video" aria-selected="false">视频字幕</button>
  </nav>
  <main>
    <section class="panel" data-panel="live">
      <section class="session-card" aria-label="直播实时会话">
        <div class="session-meta">
          <label class="language">源 <select id="source-language" aria-label="源语言"><option value="es">西班牙语</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="pt">葡萄牙语</option></select> → <strong>简体中文</strong></label>
          <div id="session-time" class="session-time" hidden>⏱ 00:00</div>
        </div>
        <div id="vu-bars" class="vu" aria-label="音量表">
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
        </div>
        <div id="capture-status" class="status">准备好后开始捕获当前标签页音频。字幕会显示在页面上和下方的实时转写中。</div>
        <div class="actions">
          <button id="start-capture" class="button primary" type="button">开始捕获</button>
          <button id="stop-capture" class="button secondary" type="button">停止</button>
        </div>
      </section>
      <section>
        <div class="transcript-head"><h2>实时转写</h2><span class="hint">原文 · 中文译文</span></div>
        <div id="transcript" class="transcript"><div class="empty">开始捕获后，已定稿的话轮和进行中的转写会显示在这里。</div></div>
      </section>
    </section>
    <section class="panel" data-panel="video" hidden>
      <section id="video-card" class="video-card" hidden>
        <img id="video-cover" class="cover" alt="视频封面" />
        <div>
          <div class="video-title-row"><strong>当前 TikTok 视频</strong><span id="video-source" class="video-meta"></span></div>
          <div id="video-description" class="video-description"></div>
        </div>
      </section>
      <div id="video-status" class="status">打开 TikTok 视频页面后，这里会显示当前视频的原生字幕。</div>
      <section>
        <div class="transcript-head"><h2>字幕和译文</h2><span id="video-count" class="hint"></span></div>
        <div id="video-captions" class="video-captions"><div class="empty">尚未读取字幕。</div></div>
      </section>
      <div class="video-actions">
        <button id="copy-video" class="button secondary" type="button" disabled>复制</button>
        <button id="open-workspace" class="button primary" type="button">侧边栏</button>
        <button id="open-summary" class="button secondary" type="button" disabled>总结</button>
        <button id="open-rewrite" class="button secondary" type="button" disabled>仿写</button>
      </div>
    </section>
  </main>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
