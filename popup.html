<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>EchoSage</title>
  <link rel="icon" type="image/png" href="icons/icon-32.png" />
  <style>
    :root {
      --accent: oklch(0.58 0.14 195);
      --ink: #1d1b18;
      --ink-2: #3b372f;
      --ink-3: #6f6a63;
      --ink-4: #8a857e;
      --ink-5: #96918a;
      --ink-6: #a29d95;
      --ink-7: #b8b3ac;
      --fill: #f7f6f3;
      --fill-2: #f4f2ef;
      --line: #eceae6;
      --line-2: #e3e0da;
      --warn-bg: oklch(0.98 0.02 75);
      --warn-line: oklch(0.9 0.05 75);
      --warn-ink: oklch(0.7 0.14 75);
      --ok: oklch(0.62 0.15 150);
      --ok-bg: oklch(0.97 0.02 150);
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { width: 400px; margin: 0; background: #fff; font-size: 12.5px; }
    button, select { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    /* ---------- 外壳 ---------- */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 700; }
    .mark { display: block; width: 22px; height: 22px; flex: none; object-fit: contain; }
    .icon-button { display: grid; width: 26px; height: 26px; place-items: center; border: 0; border-radius: 7px; background: var(--fill-2); color: var(--ink-3); cursor: pointer; font-size: 13px; }
    .icon-button:hover { background: var(--line); }

    .tabs { display: flex; gap: 6px; padding: 0 16px; }
    .tab { flex: 1; padding: 9px 0; border: 0; border-radius: 9px 9px 0 0; background: transparent; color: var(--ink-5); cursor: pointer; font-size: 13px; text-align: center; }
    .tab[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--accent); color: var(--ink); font-weight: 500; }
    .tabs-rule { height: 1px; background: var(--line); }

    main { padding: 16px; }
    .panel { display: flex; flex-direction: column; gap: 14px; }

    /* ---------- 通用零件 ---------- */
    .lang-row { display: flex; align-items: center; gap: 8px; }
    .lang-pill { position: relative; display: flex; flex: 1; min-width: 0; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 9px; background: var(--fill); }
    .lang-pill > .lang-tag { color: var(--ink-5); font-size: 11px; }
    .lang-pill > select { flex: 1; min-width: 0; appearance: none; border: 0; background: transparent; cursor: pointer; font-size: 12.5px; }
    .lang-pill > .caret { color: var(--ink-7); font-size: 10px; pointer-events: none; }
    .lang-pill > select:disabled { cursor: default; opacity: 1; }
    .lang-arrow { color: var(--ink-7); font-size: 12px; }
    .lang-static { flex: 1; font-size: 12.5px; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
    .toggle input { position: absolute; width: 0; height: 0; opacity: 0; }
    .toggle .track { display: flex; width: 34px; height: 20px; flex: none; justify-content: flex-start; padding: 2px; border-radius: 10px; background: var(--line-2); transition: background .15s ease; }
    .toggle .track::after { width: 16px; height: 16px; border-radius: 50%; background: #fff; content: ""; transition: transform .15s ease; }
    .toggle input:checked + .track { background: var(--accent); }
    .toggle input:checked + .track::after { transform: translateX(14px); }
    .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
    .toggle-hint { color: var(--ink-5); font-size: 11.5px; }

    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .section-head h2 { margin: 0; color: var(--ink-4); font-size: 11px; font-weight: 500; letter-spacing: .04em; }
    .count { color: var(--ink-7); font-family: var(--mono); font-size: 10.5px; }

    .button { min-height: 36px; border: 0; border-radius: 10px; cursor: pointer; font-size: 12.5px; }
    .button:disabled { cursor: default; opacity: .45; }
    .button.neutral { background: var(--fill-2); color: var(--ink-3); }
    .button.neutral:hover:not(:disabled) { background: var(--line); }
    .button.neutral.strong { color: var(--ink); font-weight: 500; }
    .button.accent { background: var(--accent); color: #fff; font-weight: 500; }
    .actions { display: flex; gap: 8px; }
    .actions > .grow { flex: 1; }

    .banner { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; background: var(--fill); }
    .banner > .text { flex: 1; color: var(--ink-2); font-size: 11.5px; line-height: 1.5; }
    .banner > .dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--ok); }
    .banner.ok { background: var(--ok-bg); }
    .banner > .link { border: 0; background: transparent; color: var(--accent); cursor: pointer; font-size: 11.5px; }
    .banner.muted > .text { color: var(--ink-4); }

    .download-card { display: flex; flex-direction: column; gap: 9px; padding: 12px; border: 1px solid var(--warn-line); border-radius: 11px; background: var(--warn-bg); }
    .download-card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .download-card .title { font-size: 12.5px; font-weight: 500; }
    .download-card .pct { color: var(--ink-4); font-family: var(--mono); font-size: 11px; }
    .download-card .bar { height: 5px; overflow: hidden; border-radius: 3px; background: #eae6dd; }
    .download-card .bar > i { display: block; height: 100%; background: var(--warn-ink); transition: width .25s ease; }
    .download-card .hint { color: var(--ink-3); font-size: 11.5px; line-height: 1.6; }

    /* ---------- 直播实时：空闲态 ---------- */
    .start-card { display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 22px 16px; border: 0; border-radius: 11px; background: var(--fill); cursor: pointer; text-align: center; }
    .start-card:hover { background: var(--line); }
    .start-card:disabled { cursor: default; opacity: .6; }
    .start-card .disc { display: grid; width: 52px; height: 52px; place-items: center; border-radius: 50%; background: var(--accent); box-shadow: 0 4px 12px rgb(0 0 0 / 14%); }
    .start-card .disc::after { width: 0; height: 0; margin-left: 4px; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 15px solid #fff; content: ""; }
    .start-card .title { font-size: 13px; font-weight: 500; }
    .start-card .hint { max-width: 250px; color: var(--ink-4); font-size: 11.5px; line-height: 1.6; }

    /* ---------- 直播实时：捕获态 ---------- */
    .live-card { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 11px; background: var(--fill); }
    .stop-disc { display: grid; width: 40px; height: 40px; flex: none; place-items: center; border: 0; border-radius: 50%; background: var(--accent); box-shadow: 0 2px 8px rgb(0 0 0 / 12%); cursor: pointer; }
    .stop-disc::after { width: 12px; height: 12px; border-radius: 3px; background: #fff; content: ""; }
    .live-card .body { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 5px; }
    .live-card .state { display: flex; align-items: center; gap: 6px; }
    .live-card .state .dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--ok); }
    .live-card .state .label { font-size: 12.5px; font-weight: 500; }
    .live-card .elapsed { flex: none; color: var(--ink-4); font-family: var(--mono); font-size: 11px; }
    .vu { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
    .vu-bar { width: 3px; height: 16px; border-radius: 2px; background: var(--accent); opacity: .25; transform: scaleY(.2); transform-origin: bottom; transition: transform .1s ease, opacity .1s ease; }

    .transcript-block { display: flex; flex-direction: column; gap: 7px; }
    .transcript { display: flex; max-height: 186px; overflow-y: auto; flex-direction: column; gap: 9px; padding: 11px 12px; border-radius: 11px; background: var(--fill); }
    .turn { display: flex; flex-direction: column; gap: 2px; }
    .turn .source { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
    .turn .translation { color: var(--ink); font-size: 12.5px; font-weight: 500; line-height: 1.45; }
    .turn.partial .source, .turn.partial .translation { color: var(--ink-6); font-style: italic; font-weight: 400; }
    .placeholder { color: var(--ink-6); font-size: 12px; line-height: 1.65; }

    /* ---------- 视频字幕 ---------- */
    .video-head { display: flex; align-items: flex-start; gap: 10px; }
    .video-head .cover { width: 44px; height: 58px; flex: none; border-radius: 8px; object-fit: cover; background: repeating-linear-gradient(135deg, #eceae6 0 6px, #e3e0da 6px 12px); }
    .video-head .body { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 4px; }
    .video-head .title { display: -webkit-box; overflow: hidden; font-size: 12.5px; font-weight: 500; line-height: 1.4; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .video-head .meta { color: var(--ink-6); font-family: var(--mono); font-size: 10.5px; }

    .inline-actions { display: flex; gap: 6px; }
    .chip { min-height: 28px; padding: 6px 11px; border: 0; border-radius: 8px; background: var(--fill-2); color: var(--ink-2); cursor: pointer; font-size: 11.5px; }
    .chip:hover:not(:disabled) { background: var(--line); }
    .chip:disabled { cursor: default; opacity: .45; }
    .chip.accent { background: var(--accent); color: #fff; font-weight: 500; }

    .cues { display: flex; max-height: 236px; overflow-y: auto; flex-direction: column; gap: 1px; padding: 4px; border-radius: 11px; background: var(--fill); }
    .cue { display: flex; gap: 10px; padding: 9px; border-radius: 8px; }
    .cue > .time { width: 34px; flex: none; padding-top: 2px; color: var(--ink-6); font-family: var(--mono); font-size: 10.5px; }
    .cue > .lines { display: flex; min-width: 0; flex-direction: column; gap: 2px; }
    .cue .source { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
    .cue .translation { color: var(--ink); font-size: 12.5px; font-weight: 500; line-height: 1.45; }
    .cues .placeholder { padding: 16px 9px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand"><img class="mark" src="icons/icon-48.png" alt="" width="22" height="22" /><span>EchoSage</span></div>
    <button id="open-options" class="icon-button" type="button" title="设置" aria-label="打开设置">⚙</button>
  </header>
  <nav class="tabs" aria-label="场景">
    <button class="tab" type="button" data-tab="live" aria-selected="true">直播实时</button>
    <button class="tab" type="button" data-tab="video" aria-selected="false">视频字幕</button>
  </nav>
  <div class="tabs-rule"></div>

  <main>
    <!-- ============ 直播实时 ============ -->
    <section class="panel" data-panel="live">
      <!-- 空闲态：一整块就是开始按钮 -->
      <button id="start-capture" class="start-card" type="button">
        <span class="disc" aria-hidden="true"></span>
        <span class="title">开始捕获当前标签页音频</span>
        <span class="hint">字幕会叠加在直播画面下方；切换标签页不会中断。</span>
      </button>

      <!-- 捕获态 -->
      <section id="live-card" class="live-card" aria-label="直播实时会话" hidden>
        <button id="stop-disc" class="stop-disc" type="button" aria-label="停止捕获"></button>
        <div class="body">
          <div class="state">
            <span class="dot"></span>
            <span id="live-label" class="label">正在捕获当前标签页音频</span>
          </div>
          <div id="vu-bars" class="vu" aria-label="音量表">
            <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
          </div>
        </div>
        <div id="session-time" class="elapsed">00:00</div>
      </section>

      <div class="lang-row">
        <label class="lang-pill">
          <span class="lang-tag">源</span>
          <select id="source-language" aria-label="源语言"></select>
          <span class="caret" aria-hidden="true">▾</span>
        </label>
        <span class="lang-arrow" aria-hidden="true">→</span>
        <label class="lang-pill">
          <span class="lang-tag">译</span>
          <select id="target-language" aria-label="译文语言"></select>
          <span class="caret" aria-hidden="true">▾</span>
        </label>
      </div>

      <div class="toggle-row">
        <label class="toggle"><input id="live-bilingual" type="checkbox" /><span class="track"></span><span>双语字幕</span></label>
        <span class="toggle-hint">叠加在画面下方</span>
      </div>

      <!-- 模型下载进度（仅下载中显示） -->
      <section id="model-download" class="download-card" hidden>
        <div class="row">
          <div class="title">正在下载翻译模型</div>
          <div id="model-download-pct" class="pct">0%</div>
        </div>
        <div class="bar"><i id="model-download-bar" style="width:0%"></i></div>
        <div class="hint">首次使用需下载一次，约 40 MB。下载完成后完全在本地翻译。</div>
      </section>

      <!-- 实时转写 -->
      <section id="transcript-block" class="transcript-block" hidden>
        <div class="section-head">
          <h2>实时转写</h2>
          <span id="transcript-count" class="count"></span>
        </div>
        <div id="transcript" class="transcript"></div>
      </section>

      <!-- 本地模型状态 -->
      <div id="model-banner" class="banner ok">
        <span class="dot"></span>
        <span id="model-banner-text" class="text">检测本地翻译模型…</span>
        <button id="model-manage" class="link" type="button">管理</button>
      </div>

      <div id="capture-status" class="banner muted" hidden><span id="capture-status-text" class="text"></span></div>

      <div id="live-actions" class="actions" hidden>
        <button id="stop-capture" class="button neutral grow" type="button">停止</button>
      </div>
    </section>

    <!-- ============ 视频字幕 ============ -->
    <section class="panel" data-panel="video" hidden>
      <section id="video-card" class="video-head" hidden>
        <img id="video-cover" class="cover" alt="" />
        <div class="body">
          <div id="video-description" class="title"></div>
          <div id="video-meta" class="meta"></div>
        </div>
      </section>

      <div class="lang-row">
        <label class="lang-pill">
          <span class="lang-tag">源</span>
          <span id="video-source-language" class="lang-static">自动</span>
        </label>
        <span class="lang-arrow" aria-hidden="true">→</span>
        <label class="lang-pill">
          <span class="lang-tag">译</span>
          <select id="video-target-language" aria-label="译文语言"></select>
          <span class="caret" aria-hidden="true">▾</span>
        </label>
      </div>

      <div class="toggle-row">
        <label class="toggle"><input id="video-bilingual" type="checkbox" /><span class="track"></span><span>双语对照</span></label>
        <div class="inline-actions">
          <button id="copy-video" class="chip" type="button" disabled>复制</button>
          <button id="translate-video" class="chip accent" type="button">翻译字幕</button>
        </div>
      </div>

      <section>
        <div class="section-head" style="padding-bottom:7px">
          <h2>字幕</h2>
          <span id="video-count" class="count"></span>
        </div>
        <div id="video-captions" class="cues"></div>
      </section>

      <div id="video-status" class="banner muted">
        <span id="video-status-text" class="text"></span>
        <button id="video-redetect" class="link" type="button">重新检测</button>
      </div>

      <div class="actions">
        <button id="open-summary" class="button neutral strong grow" type="button" disabled>总结</button>
        <button id="open-rewrite" class="button neutral strong grow" type="button" disabled>仿写</button>
        <button id="open-workspace" class="button neutral" type="button" style="padding:0 12px">侧边栏</button>
      </div>
    </section>
  </main>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
